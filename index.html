<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JM Basket</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JM Basket">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#f6f2ec;overflow:hidden}
  .load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#6f6355;z-index:1}
  .logo{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#f97316,#c2410c);box-shadow:0 10px 30px rgba(234,88,12,.28)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;background:transparent}
  a{color:#c2410c;font-weight:700}
</style>
</head>
<body>
  <div class="load">
    <div class="logo"><svg width="44" height="44" viewBox="0 0 64 64" fill="none"><rect x="31" y="7" width="24" height="9.5" rx="4.75" transform="rotate(28 43 12)" fill="#F5B84F" stroke="#7c2d12" stroke-width="3"/>
  <path d="M38 13.2 l3.4 1.8 M43.5 16 l3.4 1.8" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <circle cx="21" cy="20.5" r="7.8" fill="#FFF6EA" stroke="#7c2d12" stroke-width="3"/>
  <path d="M22.5 12.2 c-0.5 -4.6 -3.8 -6.4 -8.4 -5.9 c0.4 4.6 3.7 6.4 8.4 5.9 z" fill="#9CCB5A" stroke="#7c2d12" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="9.5" y="26.5" width="45" height="8.5" rx="4.25" fill="#FFF6EA" stroke="#7c2d12" stroke-width="3"/>
  <path d="M14.5 35 h35 l-3.2 14.5 a6.2 6.2 0 0 1 -6.1 5.5 h-16.4 a6.2 6.2 0 0 1 -6.1 -5.5 z" fill="#FFF6EA" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 38.5 v13 M32 38.5 v14 M40 38.5 v13" stroke="#E9CFA6" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <div>Opening JM Basket&hellip;</div>
    <div style="font-size:12.5px">Stuck? <a href="https://script.google.com/macros/s/AKfycbzDBb-_3UdZBoywFROEpqj1j1-mlhekx-UBBesgum4XkXQcltWdaZAyn1DChjNAoukz5A/exec">Tap here to open the store</a></div>
  </div>
  <iframe id="app" allow="clipboard-write" title="JM Basket POS"></iframe>
  <script>
    // always load the newest version of the store (cache-busted on every open)
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzDBb-_3UdZBoywFROEpqj1j1-mlhekx-UBBesgum4XkXQcltWdaZAyn1DChjNAoukz5A/exec';
    function loadApp(){ document.getElementById('app').src = APP_URL + '?pwa=' + Date.now(); }
    loadApp();
    // if the app was left in the background for a while, reload it on return
    // so phones always pick up the newest deployed version
    var hiddenAt = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); }
      else if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) { loadApp(); hiddenAt = 0; }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
</body>
</html>
